disallow_untyped_defs = False
ignore_missing_imports = True

[mypy-src.backend.geneweb.web.server]
ignore_errors = True

[mypy-src.backend.geneweb.web.gwd_server]
ignore_errors = True

[mypy-src.backend.template_engine]
ignore_errors = True

[mypy-src.backend.geneweb.core.definitions]
ignore_errors = True

[mypy-src.backend.geneweb.core.config]
ignore_errors = True

[mypy-src.backend.geneweb.util.string_utils]
ignore_errors = True

[mypy-src.backend.geneweb.db.driver]
ignore_errors = True

[mypy-src.backend.servers.simple_server]
ignore_errors = True

[mypy-src.backend.servers.gwd_templates]
ignore_errors = True

[mypy-src.backend.servers.gwd_simple]
ignore_errors = True

[mypy-src.backend.servers.gwd]
ignore_errors = True
