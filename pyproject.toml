[tool.black]
line-length = 120
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/setup.py
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint.messages_control]
max-line-length = 120
disable = [
    "C0114",  # missing-module-docstring (we have them)
    "C0116",  # missing-function-docstring (we're adding them)
    "R0903",  # too-few-public-methods (OK for data classes)
]

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "geneweb-python"
description = "Python modernization of GenEWeb genealogy software"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-2.0"}
authors = [
    {name = "GenEWeb Python Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology :: Genealogy",
]
dynamic = ["version"]

dependencies = [
    # Minimal dependencies for core functionality
]

[project.optional-dependencies]
dev = [
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "pylint>=2.12.0",
    "mypy>=0.910",
    "pre-commit>=2.15.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "coverage>=6.0.0",
]

[project.scripts]
gwd = "gwd_simple:main"

[project.urls]
Homepage = "https://geneweb.tuxfamily.org/"
Repository = "https://github.com/geneweb/geneweb"
Documentation = "https://geneweb.tuxfamily.org/wiki/"
"Bug Tracker" = "https://github.com/geneweb/geneweb/issues"
